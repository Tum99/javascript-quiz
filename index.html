<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>JavaScript Quiz</title>
</head>
<body>
    <main class="quiz-section">
        <div class="quiz-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="quiz-header">
                <div class="quiz-title-container">
                    <h1 class="quiz-title">JAVASCRIPT QUIZ</h1>
                </div>
                <p class="question-count" id="question-count"></p>
            </div>
            <!-- Quiz Question -->
            <div class="question-container">
                <h2 class="question" id="question"></h2>
            </div>
            <!-- Quiz Answers -->
            <div class="answers-buttons-container" id="answers-buttons"></div>
            <!-- Quiz Controls  -->
             <div class="quiz-controls">
                <button class="next-button" id="next-button" type="button" disabled>Next Question</button>
             </div>
        </div>

    </main>
    <script src="app.js"></script>

</body>
</html>
